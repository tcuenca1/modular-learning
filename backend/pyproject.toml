[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-learning"
version = "2.0.0"
description = "Plataforma de tutoría y gestión de conocimiento académica basada en consola (CLI) y Web con arquitectura hexagonal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "pyyaml>=6.0.0",
    # Guía offline descargable en PDF (infrastructure/pdf)
    "pymupdf>=1.24.0",
    "markdown-it-py>=3.0.0",
    "comtypes>=1.1.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "halo>=0.0.31",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]
# Despliegue en la nube: datos en Postgres (DATABASE_URL) en lugar de archivos
nube = [
    "psycopg[binary,pool]>=3.2",
]
dev = [
    "pytest",
    "pytest-mock",
    "httpx",
    "ruff",
    "import-linter",
    "pre-commit",
]
all = [
    "modular-learning[cli,web,nube,dev]",
]

[project.scripts]
ml = "modular_learning.apps.cli.main:app"
ml-web = "modular_learning.apps.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"modular_learning.core" = ["prompts/*.md"]
"modular_learning.apps.api" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "modular_learning"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core es agnóstico"
type = "forbidden"
source_modules = ["modular_learning.core"]
forbidden_modules = [
    "modular_learning.infrastructure",
    "modular_learning.apps",
    "typer",
    "rich",
    "questionary",
    "halo",
    "fastapi",
    "google",
    "modular_learning.settings",
    "modular_learning.bootstrap",
    "pypdf",
    "docx",
    "dotenv",
]

[[tool.importlinter.contracts]]
name = "El dominio no depende de los casos de uso"
type = "forbidden"
source_modules = ["modular_learning.core.domain"]
forbidden_modules = ["modular_learning.core.application"]

[[tool.importlinter.contracts]]
name = "Infraestructura solo depende de los puertos del core"
type = "forbidden"
source_modules = ["modular_learning.infrastructure"]
forbidden_modules = [
    "modular_learning.apps",
    "modular_learning.bootstrap",
    "modular_learning.core.application",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E402",
    "BLE001",
    "S110",
    "S112",
    "DTZ005",
    "TRY004",
]

[tool.ruff.format]
quote-style = "double"
