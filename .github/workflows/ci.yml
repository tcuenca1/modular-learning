name: CI

on:
  push:
    branches:
      - main
      - master
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  python:
    name: Python (Linter, Arquitectura y Tests)
    runs-on: ubuntu-latest
    # Postgres para los tests del almacén en la nube (test_almacen.py)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ML_TEST_DATABASE_URL: postgresql://postgres:prueba@localhost:5432/postgres
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias completas
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[all]"

      - name: Verificar estilo y calidad de código (Ruff)
        run: ruff check backend

      - name: Verificar formato (Ruff Format)
        run: ruff format --check backend

      - name: Validar contratos de arquitectura hexagonal (Import Linter)
        run: lint-imports --config backend/pyproject.toml

      - name: Ejecutar suite de pruebas (Pytest)
        run: pytest -q backend

      - name: Auditar dependencias de Python (pip-audit)
        run: |
          pip install pip-audit
          pip-audit ./backend

  frontend:
    name: Frontend (Linter y Compilación Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter (Oxlint)
        run: npm run lint

      - name: Ejecutar pruebas (Vitest)
        run: npm test

      - name: Compilar frontend React (Vite & Tailwind v4)
        run: npm run build

      - name: Auditar dependencias de npm (solo gravedad alta o crítica)
        run: npm audit --audit-level=high
