services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: modular_learning
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modular_learning"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/modular_learning
      ML_DATA_DIR: /app/data
      ML_REQUIERE_ACCESO: "0"
      RUTA_OBSIDIAN: /app/boveda
    env_file:
      - .env
    volumes:
      - ./data_ejemplo:/app/data
      - ./boveda_ejemplo:/app/boveda
      - ./scripts:/app/scripts:ro
      - ./deploy:/app/deploy:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
