[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-learning-cli"
version = "1.0.0"
description = "Plataforma de tutoría y gestión de conocimiento académica basada en consola (CLI) con Gemini"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pypdf>=3.0.0",
    "questionary>=2.0.0",
    "halo>=0.0.31",
    "docx2pdf>=0.1.8",
    "comtypes>=1.1.14"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "crewai>=0.11.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=1.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
ml = "cli:app"

[tool.setuptools]
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
include = ["modules*", "tools*"]
exclude = ["obsidian_vault*", "data*"]
