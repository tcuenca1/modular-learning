[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-learning-cli"
version = "1.0.0"
description = "Plataforma de tutoría y gestión de conocimiento académica basada en consola (CLI) con Gemini"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pypdf>=3.0.0",
    "questionary>=2.0.0",
    "halo>=0.0.31",
    "pyyaml>=6.0.0",
    "python-docx>=1.0.0",
    "comtypes>=1.1.14",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9"
]

[project.scripts]
ml = "cli:app"
ml-web = "run_web:run"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E402",
    "BLE001",
    "S110",
    "S112",
    "DTZ005",
    "TRY004",
]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools]
py-modules = ["cli", "main", "run_web"]

[tool.setuptools.packages.find]
include = ["modules*", "tools*"]
exclude = ["obsidian_vault*", "data*"]

[tool.setuptools.package-data]
"modules.web" = ["static/*", "static/**/*"]
