# Blueprint de Render: servicio web gratuito con el Dockerfile; los datos viven en Postgres
# (Neon, DATABASE_URL) porque el disco del plan gratuito se borra en cada reinicio.
services:
  - type: web
    name: modular-learning
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: ML_EN_NUBE
        value: "1"
      # Se piden al crear el servicio; no se guardan en el repositorio
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Cuenta de administrador: ML_USUARIO es lo que escribes en «Correo o usuario». Cambiar
      # ML_CONTRASENA y reiniciar es la forma de recuperar el acceso si la olvidas
      - key: ML_USUARIO
        sync: false
      - key: ML_CONTRASENA
        sync: false
      # Firma las sesiones; si falta se deriva de ML_CONTRASENA (cambiarla cierra las sesiones)
      - key: ML_SECRETO_SESION
        generateValue: true
      # Carga los datos de ejemplo en la cuenta de administrador la primera vez
      - key: ML_SEMBRAR_EJEMPLOS
        value: "1"
